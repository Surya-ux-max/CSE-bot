services:
  # FastAPI Web Service
  - type: web
    name: cse-bot-backend
    env: python
    region: singapore # Change region if desired (e.g., oregon, frankfurt)
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: cse-bot-postgres
          property: connectionString

# Render PostgreSQL Managed Database
databases:
  - name: cse-bot-postgres
    plan: free
    region: singapore
    databaseName: CSE_bot
    user: postgres
