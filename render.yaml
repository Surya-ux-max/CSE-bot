services:
  # FastAPI Web Service
  - type: web
    name: cse-bot-backend
    env: python
    region: singapore # Options: singapore, oregon, frankfurt, ohio
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: cse-bot-postgres
          property: connectionString

# Render Managed PostgreSQL Database
databases:
  - name: cse-bot-postgres
    plan: free
    region: singapore
    databaseName: cse_bot
    user: cse_bot_user
